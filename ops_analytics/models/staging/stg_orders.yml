version: 2

models:
  - name: stg_orders
    description: "Clean orders, one row per order item, PII excluded"
    columns:
      - name: order_id
        description: "Order ID"
        tests:
          - not_null

      - name: order_item_id
        description: "Unique ID for each item within an order"
        tests:
          - not_null
          - unique

      - name: order_date
        description: "Date the order was placed"
        tests:
          - not_null

      - name: late_delivery_risk
        description: "Late delivery risk flag (0 = no, 1 = yes)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: delivery_status
        description: "Delivery status"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Advance shipping', 'Late delivery', 'Shipping canceled', 'Shipping on time']

      - name: sales
        description: "Sales amount for the item"
        tests:
          - not_null